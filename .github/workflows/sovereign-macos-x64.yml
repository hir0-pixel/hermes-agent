# Experimental unsigned macOS x64 Hermes zip with bundled Sovereign engine.
# See .github/HANDOFF-sovereign-macos-x64.md for Apple Silicon / cross-pack blockers.
name: Sovereign macOS x64 pack

on:
  workflow_dispatch:
    inputs:
      engine_repository:
        description: GitHub repo that contains the sovereign/jcode engine (owner/name)
        required: true
        default: 'hir0-pixel/jcode'
      engine_ref:
        description: Branch or SHA of the engine repo
        required: true
        default: 'feature/sovereign-observability'
  push:
    branches:
      - feature/sovereign-observability
    paths:
      - 'apps/desktop/scripts/stage-sovereign-python.mjs'
      - 'apps/desktop/scripts/before-pack.mjs'
      - 'apps/desktop/e2e/sovereign-*.mjs'
      - '.github/workflows/sovereign-macos-x64.yml'
      - '.github/HANDOFF-sovereign-macos-x64.md'

permissions:
  contents: read

concurrency:
  group: sovereign-macos-x64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mac-x64:
    name: Pack + smoke (macOS x64)
    # Intel runner: native x86_64 sovereign + uv Python + electron-builder --x64.
    runs-on: macos-13
    timeout-minutes: 120
    steps:
      - name: Checkout hermes-agent
        uses: actions/checkout@v4

      - name: Resolve engine checkout
        id: engine
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "repository=${{ inputs.engine_repository }}" >> "$GITHUB_OUTPUT"
            echo "ref=${{ inputs.engine_ref }}" >> "$GITHUB_OUTPUT"
          else
            echo "repository=hir0-pixel/jcode" >> "$GITHUB_OUTPUT"
            echo "ref=feature/sovereign-observability" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout sovereign engine
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.engine.outputs.repository }}
          ref: ${{ steps.engine.outputs.ref }}
          path: sovereign-engine
          token: ${{ secrets.SOVEREIGN_ENGINE_CHECKOUT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: '0.9.28'
          enable-cache: true

      - name: npm ci (workspace)
        run: npm ci

      - name: Build sovereign (native x64)
        working-directory: sovereign-engine
        run: cargo build --release --bin sovereign

      - name: Stage Sovereign Python (macOS x64)
        working-directory: apps/desktop
        run: npm run stage:sovereign-python

      - name: Pack macOS x64 zip
        working-directory: apps/desktop
        run: npm run build && npm run builder -- --mac zip --x64
        env:
          SOVEREIGN_ENGINE_ROOT: ${{ github.workspace }}/sovereign-engine
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Unzip for smoke (Hermes.app)
        working-directory: apps/desktop
        run: |
          set -euo pipefail
          rm -rf release/mac-smoke
          mkdir -p release/mac-smoke
          zip="$(ls -1 release/Hermes-*-mac-x64.zip | head -1)"
          ditto -x -k "$zip" release/mac-smoke
          test -d release/mac-smoke/Hermes.app

      - name: Sovereign smoke — launch + cron idle
        working-directory: apps/desktop
        env:
          SOVEREIGN_PACKAGED_ROOT: ${{ github.workspace }}/apps/desktop/release/mac-smoke
          SOVEREIGN_INSTALL_E2E_OUTPUT: ${{ runner.temp }}/sovereign-install
        run: node e2e/sovereign-install-launch.mjs

      - name: Sovereign smoke — orphan cleanup
        working-directory: apps/desktop
        env:
          SOVEREIGN_PACKAGED_ROOT: ${{ github.workspace }}/apps/desktop/release/mac-smoke
          SOVEREIGN_ORPHAN_E2E_OUTPUT: ${{ runner.temp }}/sovereign-orphan
        run: node e2e/sovereign-packaged-orphan-cleanup.mjs

      - name: Sovereign smoke — API key (headless engine)
        working-directory: apps/desktop
        env:
          SOVEREIGN_PACKAGED_ROOT: ${{ github.workspace }}/apps/desktop/release/mac-smoke
          SOVEREIGN_APIKEY_E2E_OUTPUT: ${{ runner.temp }}/sovereign-apikey
        run: node e2e/sovereign-packaged-apikey.mjs

      - name: Sovereign smoke — chat + Ollama (optional)
        working-directory: apps/desktop
        shell: bash
        env:
          SOVEREIGN_PACKAGED_ROOT: ${{ github.workspace }}/apps/desktop/release/mac-smoke
          SOVEREIGN_CHAT_E2E_OUTPUT: ${{ runner.temp }}/sovereign-chat
        run: |
          set -euo pipefail
          if curl -sf http://127.0.0.1:11434/api/tags >/dev/null 2>&1; then
            node e2e/sovereign-packaged-chat-approval.mjs
          else
            echo "::notice title=Ollama skipped::No Ollama on macos-13 GHA runner — chat smoke skipped (expected without GPU/local service)."
          fi

      - name: Upload macOS x64 zip
        uses: actions/upload-artifact@v4
        with:
          name: Hermes-macos-x64-zip
          path: apps/desktop/release/Hermes-*-mac-x64.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload sovereign smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sovereign-macos-x64-smoke-logs
          path: |
            ${{ runner.temp }}/sovereign-*
          if-no-files-found: ignore
          retention-days: 14
